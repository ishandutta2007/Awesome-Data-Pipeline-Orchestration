<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background-color: #0d1117; border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    /* Background animated elements */
    .bg-node {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 12, 12;
      animation: flow 20s linear infinite;
    }
    .particle {
      animation: float 6s ease-in-out infinite alternate;
    }

    @keyframes flow {
      from { stroke-dashoffset: 240; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.4; }
      100% { transform: scale(1.08); opacity: 0.7; }
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
  </style>

  <!-- Base Layer -->
  <rect width="1200" height="360" rx="12" fill="url(#bg-grad)" />

  <!-- Background Dynamic / Animated Pipeline Flow Graphics (Kept behind foreground text) -->
  <g opacity="0.35">
    <!-- Connecting Workflow Lines -->
    <path class="flow-line" d="M 100 80 Q 300 20 500 90 T 900 60 T 1100 120" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flow-line" d="M 50 280 Q 250 340 550 270 T 950 310 T 1150 240" fill="none" stroke="#a855f7" stroke-width="2" />
    <path class="flow-line" d="M 200 320 Q 400 180 700 290 T 1050 180" fill="none" stroke="#6366f1" stroke-width="1.5" />

    <!-- Ambient Nodes -->
    <circle cx="150" cy="90" r="18" fill="url(#cyan-glow)" class="bg-node" />
    <circle cx="500" cy="90" r="24" fill="url(#purple-glow)" class="bg-node" />
    <circle cx="900" cy="60" r="15" fill="url(#cyan-glow)" class="bg-node" />
    <circle cx="250" cy="310" r="20" fill="url(#purple-glow)" class="bg-node" />
    <circle cx="700" cy="290" r="22" fill="url(#cyan-glow)" class="bg-node" />
    <circle cx="1050" cy="220" r="16" fill="url(#purple-glow)" class="bg-node" />
  </g>

  <!-- Foreground Title and Subtitle Overlay (Clear & Unobscured) -->
  <g filter="url(#shadow)">
    <!-- Category Badge -->
    <rect x="425" y="45" width="350" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="600" y="66" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">⚡ DATA ENGINEERING &amp; ORCHESTRATION ⚡</text>

    <!-- Main Title -->
    <text x="600" y="140" fill="url(#text-grad)" font-size="44" font-weight="900" letter-spacing="-0.5" text-anchor="middle">
      Awesome Data Pipeline Orchestration
    </text>

    <!-- Subtitle -->
    <text x="600" y="185" fill="#f8fafc" font-size="18" font-weight="500" text-anchor="middle">
      Curated Ecosystem of Modern SaaS Platforms &amp; Open-Source Workflow Engines
    </text>

    <!-- Key Feature Pills (In Foreground Container) -->
    <g transform="translate(230, 225)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="160" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="80" y="24" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">🚀 SaaS &amp; Cloud</text>

      <!-- Pill 2 -->
      <rect x="180" y="0" width="180" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="270" y="24" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">⭐ Open-Source Stars</text>

      <!-- Pill 3 -->
      <rect x="380" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="465" y="24" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">📊 Market &amp; Pricing</text>

      <!-- Pill 4 -->
      <rect x="570" y="0" width="170" height="38" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="655" y="24" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">⚙️ Workflow DAGs</text>
    </g>

    <!-- Footer Meta -->
    <text x="600" y="315" fill="#64748b" font-size="13" font-weight="500" text-anchor="middle">
      Updated October 2026 • Community Curated • Apache Airflow, Prefect, Dagster, Kestra, Temporal &amp; More
    </text>
  </g>
</svg>
